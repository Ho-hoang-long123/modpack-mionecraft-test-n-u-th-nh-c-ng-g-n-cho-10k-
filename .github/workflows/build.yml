name: Build Fabric Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn từ Repo
        uses: actions/checkout@v4

      - name: Cài đặt Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cài đặt Gradle và Build Mod
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Chạy lệnh biên dịch ra file JAR
        run: gradle build

      - name: Xuất file JAR để tải về
        uses: actions/upload-artifact@v4
        with:
          name: WorldReset-Mod-1.21.1
          path: build/libs/worldreset-1.0.0.jar
